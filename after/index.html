<!doctype html><html lang="ko"><head><title>커피 배달 게임 | 프롬프트 구조화 실습</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>

body{margin:0;background:#efe5d2;font-family:"Noto Sans KR","Malgun Gothic",sans-serif;color:#3f5346;overflow:hidden}
main{height:100vh;display:flex;align-items:center;justify-content:center}
/* The frame is 3:2. object-fit keeps that ratio at any window size instead of stretching it. */
canvas{width:100%;height:100%;object-fit:contain;display:block;outline:none}

/* Full-screen panels: title, how-to-play, pause and result. */
.screen{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;
 gap:16px;padding:24px;background:rgba(236,226,206,.94);text-align:center}
.screen[hidden]{display:none}
.screen h1{margin:0;font-size:clamp(30px,6vw,52px);letter-spacing:-.01em;color:#3c5a49}
.screen h2{margin:0 0 4px;font-size:clamp(22px,4vw,30px);color:#3c5a49}
.screen .lead{margin:0 0 14px;font-size:16px;color:#6d7a63;max-width:34rem;line-height:1.7;word-break:keep-all}
.screen button{font:600 17px/1 inherit;padding:15px 30px;min-width:230px;border-radius:999px;cursor:pointer;
 border:1px solid #c3b899;background:#fffaee;color:#3d6154;transition:transform .06s ease,background .12s ease}
.screen button:hover{background:#fff;transform:translateY(-1px)}
.screen button:active{transform:translateY(1px)}
.screen button.primary{background:linear-gradient(#5c8a78,#47705f);border-color:#3b6151;color:#fff8ea}
.screen button.primary:hover{background:linear-gradient(#679680,#4e7a68)}
.screen button:focus-visible{outline:2px solid #7f9f8e;outline-offset:3px}

/* How to play: pictures first, a handful of words second. */
.how{display:flex;flex-direction:column;align-items:center;gap:20px}
.keys{display:flex;gap:30px;flex-wrap:wrap;justify-content:center}
.key{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600;color:#6d7a63}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:33rem;width:100%}
.card{display:flex;align-items:center;gap:13px;background:#fffaee;border:1px solid #d9cdb0;border-radius:15px;padding:12px 15px}
.card span{font-size:14.5px;font-weight:600;color:#4c5c4d;line-height:1.45;word-break:keep-all;text-align:left}
.card svg{flex:none}
.note{margin:2px 0 0;font-size:13px;color:#8d8568;word-break:keep-all}
.note b{color:#5f6d58}
@media(max-width:560px){.cards{grid-template-columns:1fr}.keys{gap:18px}}
